<!doctype html>
<!--
  Bonsai 2 Small chat window.
  Talks to any OpenAI-compatible server on localhost:
    GGUF -> llama-server (PrismML fork)   serves this page itself at http://localhost:8080
    MLX  -> python -m mlx_vlm.server      open this file directly in your browser
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bonsai 2 Chat</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f7f4; --fg: #1d211c; --muted: #6b7266; --line: #d9ddd4; --you: #2f6b3a; --card: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #151814; --fg: #e6e9e2; --muted: #8d9587; --line: #2c3229; --you: #4f9a5c; --card: #1d211c; } }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
  header { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; }
  header .model { color: var(--muted); font-size: 13px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header input[type=text] { width: 190px; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; max-width: 820px; width: 100%; margin: 0 auto; }
  .msg { padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; word-wrap: break-word; max-width: 90%; }
  .user { align-self: flex-end; background: var(--you); color: #fff; }
  .assistant { align-self: flex-start; background: var(--card); border: 1px solid var(--line); }
  .error { align-self: center; color: #c0392b; font-size: 13px; }
  details { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
  details pre { white-space: pre-wrap; font: inherit; margin: 6px 0 0; max-height: 240px; overflow-y: auto; }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); max-width: 820px; width: 100%; margin: 0 auto; }
  textarea { flex: 1; resize: none; height: 48px; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--fg); font: inherit; }
  button, input[type=text] { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); font: inherit; }
  button[type=submit] { background: var(--you); color: #fff; border: none; padding: 0 18px; }
  label { font-size: 13px; display: flex; gap: 4px; align-items: center; }
</style>
</head>
<body>
<header>
  <h1>Bonsai 2 Chat</h1>
  <span class="model" id="model">connecting…</span>
  <label><input type="checkbox" id="thinking"> Thinking</label>
  <input type="text" id="server" title="Server URL">
  <button id="reset">New chat</button>
</header>
<div id="log"></div>
<form id="form">
  <textarea id="input" placeholder="Message Bonsai… (Enter to send, Shift+Enter for a new line)"></textarea>
  <button type="submit" id="send">Send</button>
</form>

<script>
// Sampling presets from the Bonsai 2 model cards. Send all of them on every request:
// neither server reads presence_penalty / min_p from the model's metadata.
const PRESETS = {
  thinking:    { temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0, presence_penalty: 1.0, repetition_penalty: 1.0, max_tokens: 8192 },
  nonThinking: { temperature: 0.7, top_p: 0.80, top_k: 20, min_p: 0, presence_penalty: 1.5, repetition_penalty: 1.0, max_tokens: 2048 },
};
const SYSTEM_PROMPT = "You are a helpful assistant.";

const $ = (id) => document.getElementById(id);
const serverInput = $("server");
// Served by llama-server -> same origin. Opened as a file (MLX) -> default port 8080.
serverInput.value = location.protocol.startsWith("http") ? location.origin : "http://localhost:8080";

let messages = [];
let modelId = "";
let busy = false;

async function loadModel() {
  try {
    const res = await fetch(`${serverInput.value}/v1/models`);
    const { data } = await res.json();
    // mlx_vlm.server also lists cached models; prefer the one actually loaded.
    const model = data.find((m) => m.loaded) ?? data[0];
    modelId = model.id;
    $("model").textContent = modelId.split(/[\\/]/).pop();
  } catch {
    $("model").textContent = `no server at ${serverInput.value}`;
  }
}

function addBubble(cls, text = "") {
  const div = document.createElement("div");
  div.className = `msg ${cls}`;
  div.textContent = text;
  $("log").appendChild(div);
  $("log").scrollTop = $("log").scrollHeight;
  return div;
}

async function send(text) {
  messages.push({ role: "user", content: text });
  addBubble("user", text);

  const thinking = $("thinking").checked;
  const bubble = addBubble("assistant");
  const details = document.createElement("details");
  details.innerHTML = "<summary>Thinking…</summary><pre></pre>";
  const thoughts = details.querySelector("pre");
  const answer = document.createElement("div");
  bubble.append(answer);

  let content = "";
  let reasoning = "";
  const render = () => {
    // Fallback: if a server leaves <think>…</think> inline, split it out here.
    let shown = content;
    let inline = "";
    const m = content.match(/^\s*<think>([\s\S]*?)(<\/think>|$)/);
    if (m) { inline = m[1]; shown = content.slice(m[0].length); }
    const allThoughts = (reasoning + inline).trim();
    if (allThoughts && !details.isConnected) bubble.prepend(details);
    thoughts.textContent = allThoughts;
    answer.textContent = shown.trimStart();
    $("log").scrollTop = $("log").scrollHeight;
  };

  const res = await fetch(`${serverInput.value}/v1/chat/completions`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: modelId,
      messages: [{ role: "system", content: SYSTEM_PROMPT }, ...messages],
      stream: true,
      chat_template_kwargs: { enable_thinking: thinking },
      ...(thinking ? PRESETS.thinking : PRESETS.nonThinking),
    }),
  });
  if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);

  // Read the server-sent events stream: lines of "data: {json}".
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split("\n");
    buffer = lines.pop();
    for (const line of lines) {
      if (!line.startsWith("data:")) continue;
      const data = line.slice(5).trim();
      if (data === "[DONE]") continue;
      const delta = JSON.parse(data).choices?.[0]?.delta ?? {};
      reasoning += delta.reasoning_content ?? delta.reasoning ?? "";
      content += delta.content ?? "";
      render();
    }
  }
  // Only the answer goes back into history, not the reasoning.
  messages.push({ role: "assistant", content: answer.textContent });
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = $("input").value.trim();
  if (!text || busy) return;
  $("input").value = "";
  busy = true;
  $("send").disabled = true;
  try {
    if (!modelId) await loadModel();
    await send(text);
  } catch (err) {
    if (messages.at(-1)?.role === "user") messages.pop(); // keep history valid for a retry
    addBubble("error", `Error: ${err.message}`);
  } finally {
    busy = false;
    $("send").disabled = false;
    $("input").focus();
  }
});

$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); }
});
$("reset").addEventListener("click", () => { messages = []; $("log").innerHTML = ""; });
serverInput.addEventListener("change", () => { modelId = ""; loadModel(); });

loadModel();
</script>
</body>
</html>
